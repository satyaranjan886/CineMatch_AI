# Local development stack only — not production.
# Bind to loopback and require Redis auth. Override passwords via .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinematch}
      POSTGRES_USER: ${POSTGRES_USER:-cinematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinematch-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinematch} -d ${POSTGRES_DB:-cinematch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cinematch-local-redis}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cinematch-local-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-cinematch}:${POSTGRES_PASSWORD:-cinematch-local-only}@postgres:5432/${POSTGRES_DB:-cinematch}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/2
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A config.celery worker --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-cinematch}:${POSTGRES_PASSWORD:-cinematch-local-only}@postgres:5432/${POSTGRES_DB:-cinematch}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A config.celery beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-cinematch}:${POSTGRES_PASSWORD:-cinematch-local-only}@postgres:5432/${POSTGRES_DB:-cinematch}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-cinematch-local-redis}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
