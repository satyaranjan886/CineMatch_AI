# Shared application location blocks for HTTP and HTTPS server contexts.
# Included from conf.d server files — do not place a `server {}` here.

# Health for the reverse proxy itself (Compose / LB probes). Keep on HTTP even when TLS is on.
location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location /static/ {
    alias /var/www/static/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /media/ {
    alias /var/www/media/;
    access_log off;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/(health|ready)/ {
    proxy_pass http://cinematch_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Metrics: private networks only at the edge. Application also enforces token/IP checks.
location = /metrics/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location = /api/v1/metrics/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

# Django admin: staff auth required in Django; edge restricts to private networks.
location /admin/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    limit_req zone=api_limit burst=10 nodelay;
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location /api/v1/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_conn addr 20;
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn addr 40;
    client_max_body_size 2m;
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location /api/schema/ {
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location /api/docs/ {
    proxy_pass http://cinematch_api;
    include /etc/nginx/proxy_params.conf;
}

location / {
    proxy_pass http://cinematch_frontend;
    include /etc/nginx/proxy_params.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
