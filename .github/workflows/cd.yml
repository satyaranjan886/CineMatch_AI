name: CD

# Deploys to AWS only from the production branch after a successful CI run.
# Secrets live in GitHub Environment / repository secrets — never in the repo.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (default: commit SHA)"
        required: false
        type: string

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PRODUCTION_BRANCH: main

jobs:
  guard:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - name: Resolve deployment target
        id: meta
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.ref }}"
            SHA="${{ github.sha }}"
            if [ "$REF" != "refs/heads/${{ env.PRODUCTION_BRANCH }}" ]; then
              echo "::error::Manual deploy allowed only from ${{ env.PRODUCTION_BRANCH }} (got $REF)"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            SHOULD=true
          else
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::warning::Skipping deploy — CI conclusion was '$CONCLUSION'"
              SHOULD=false
            elif [ "$HEAD_BRANCH" != "${{ env.PRODUCTION_BRANCH }}" ]; then
              echo "::warning::Skipping deploy — CI branch was '$HEAD_BRANCH'"
              SHOULD=false
            else
              SHOULD=true
            fi
          fi

          SHORT="$(echo "$SHA" | cut -c1-12)"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$SHORT"
          fi

          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT"
            echo "image_tag=$TAG"
            echo "should_deploy=$SHOULD"
          } >> "$GITHUB_OUTPUT"

          echo "sha=$SHA short_sha=$SHORT image_tag=$TAG should_deploy=$SHOULD"

  release:
    name: Build, push, and deploy
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.guard.outputs.image_tag }}
        run: |
          set -euo pipefail
          BACKEND="${REGISTRY}/${{ secrets.ECR_REPOSITORY_BACKEND }}:${TAG}"
          FRONTEND="${REGISTRY}/${{ secrets.ECR_REPOSITORY_FRONTEND }}:${TAG}"
          NGINX="${REGISTRY}/${{ secrets.ECR_REPOSITORY_NGINX }}:${TAG}"
          {
            echo "backend_image=$BACKEND"
            echo "frontend_image=$FRONTEND"
            echo "nginx_image=$NGINX"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_BACKEND }}:latest
          cache-from: type=gha,scope=backend-cd
          cache-to: type=gha,mode=max,scope=backend-cd

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend-cd
          cache-to: type=gha,mode=max,scope=frontend-cd

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./infrastructure/nginx
          file: infrastructure/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.nginx_image }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NGINX }}:latest
          cache-from: type=gha,scope=nginx-cd
          cache-to: type=gha,mode=max,scope=nginx-cd

      - name: Deploy via SSM Run Command
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          NGINX_IMAGE: ${{ steps.images.outputs.nginx_image }}
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID}" ]; then
            echo "::error::EC2_INSTANCE_ID secret is required"
            exit 1
          fi
          APP_DIR="${APP_DIR:-/opt/cinematch}"
          REGISTRY="$(echo "${BACKEND_IMAGE}" | cut -d/ -f1)"

          REMOTE_SCRIPT=$(cat <<'EOS'
          set -euo pipefail
          cd "$APP_DIR"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          export BACKEND_IMAGE FRONTEND_IMAGE NGINX_IMAGE IMAGE_TAG
          docker compose -f docker-compose.prod.yml --env-file .env.production pull backend frontend nginx celery_worker celery_beat
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --remove-orphans
          docker image prune -f
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1/nginx-health
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1/ready/ \
            || curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1/api/v1/ready/
          EOS
          )

          # Inject env into the remote script header.
          FULL_SCRIPT=$(cat <<EOF
          export APP_DIR='${APP_DIR}'
          export REGION='${REGION}'
          export REGISTRY='${REGISTRY}'
          export BACKEND_IMAGE='${BACKEND_IMAGE}'
          export FRONTEND_IMAGE='${FRONTEND_IMAGE}'
          export NGINX_IMAGE='${NGINX_IMAGE}'
          export IMAGE_TAG='${IMAGE_TAG}'
          ${REMOTE_SCRIPT}
          EOF
          )

          PARAMS=$(jq -n --arg cmd "$FULL_SCRIPT" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CineMatch CD deploy ${IMAGE_TAG}" \
            --parameters "$PARAMS" \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId=${COMMAND_ID}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt ${i}: ${STATUS}"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 0
                ;;
              Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "[Status,StandardOutputContent,StandardErrorContent]" \
                  --output text
                echo "::error::Deploy SSM command failed with status ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for SSM deploy command"
          exit 1

      - name: Public smoke check
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "PRODUCTION_URL secret not set — skipping public smoke check"
            exit 0
          fi
          BASE="${PRODUCTION_URL%/}"
          curl -fsS --retry 8 --retry-delay 5 "${BASE}/ready/" \
            || curl -fsS --retry 8 --retry-delay 5 "${BASE}/api/v1/ready/"
          echo "Smoke checks passed against ${BASE}"

  notify-failure:
    name: Failure signal
    needs: [guard, release]
    if: failure() && needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failure
        run: |
          echo "::error::CD failed for sha=${{ needs.guard.outputs.sha }} tag=${{ needs.guard.outputs.image_tag }}"
          echo "Inspect the failed job logs, SSM command output, and /ready/ on the host."
          exit 1
